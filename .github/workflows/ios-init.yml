name: Build iOS and Upload TestFlight

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v5

      # ---------------------------------------------------------
      # Flutter
      # ---------------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        working-directory: mobile
        run: flutter --version

      - name: Flutter pub get
        working-directory: mobile
        run: flutter pub get

      # ---------------------------------------------------------
      # Install Apple Distribution certificate
      # ---------------------------------------------------------
      - name: Install signing certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -e

          CERTIFICATE_PATH="$RUNNER_TEMP/WordZoo_Distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/wordzoo-build.keychain-db"

          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          echo "Checking certificate file..."
          ls -lh "$CERTIFICATE_PATH"

          security create-keychain \
            -p "github-actions" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "github-actions" \
            "$KEYCHAIN_PATH"

          # Make this keychain available to codesign/Xcode
          security list-keychain \
            -d user \
            -s "$KEYCHAIN_PATH" \
            "$HOME/Library/Keychains/login.keychain-db"

          security default-keychain \
            -s "$KEYCHAIN_PATH"

          # Import certificate + private key
          security import "$CERTIFICATE_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Allow Apple tools to access the private key
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "github-actions" \
            "$KEYCHAIN_PATH"

          echo "======================================"
          echo "KEYCHAIN CONTENTS"
          echo "======================================"

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

          echo "======================================"
          echo "CERTIFICATES"
          echo "======================================"

          security find-certificate \
            -a \
            -p \
            "$KEYCHAIN_PATH" > "$RUNNER_TEMP/certificates.pem"

          security find-certificate \
            -a \
            -Z \
            "$KEYCHAIN_PATH"

          echo "======================================"
          echo "PRIVATE KEYS"
          echo "======================================"

          security find-key \
            -a \
            "$KEYCHAIN_PATH" || true

      # ---------------------------------------------------------
      # Verify signing identity
      # ---------------------------------------------------------
      - name: Get signing identity
        run: |
          security find-identity \
            -v \
            -p codesigning \
            "$RUNNER_TEMP/wordzoo-build.keychain-db"

      # ---------------------------------------------------------
      # Install provisioning profile
      # ---------------------------------------------------------
      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH="$RUNNER_TEMP/WordZoo.mobileprovision"

          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/WordZoo.mobileprovision"

          security cms \
            -D \
            -i "$PROFILE_PATH" \
            > "$RUNNER_TEMP/profile.plist"

          PROFILE_NAME=$(/usr/libexec/PlistBuddy \
            -c "Print :Name" \
            "$RUNNER_TEMP/profile.plist")

          PROFILE_UUID=$(/usr/libexec/PlistBuddy \
            -c "Print :UUID" \
            "$RUNNER_TEMP/profile.plist")

          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            "$RUNNER_TEMP/profile.plist")

          PROFILE_TEAM_ID=$(/usr/libexec/PlistBuddy \
            -c "Print :Entitlements:com.apple.developer.team-identifier" \
            "$RUNNER_TEMP/profile.plist")

          echo "======================================"
          echo "Provisioning Profile"
          echo "Name: $PROFILE_NAME"
          echo "UUID: $PROFILE_UUID"
          echo "Application ID: $PROFILE_APP_ID"
          echo "Team ID: $PROFILE_TEAM_ID"
          echo "======================================"

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # Verify Bundle ID and Team ID
      # ---------------------------------------------------------
      - name: Verify signing configuration
        env:
          TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM_ID }}
        run: |
          echo "Expected Team ID: $TEAM_ID"
          echo "Profile Name: $PROFILE_NAME"
          echo "Profile UUID: $PROFILE_UUID"

          if [ -z "$PROFILE_NAME" ]; then
            echo "ERROR: PROFILE_NAME is empty"
            exit 1
          fi

          if [ -z "$PROFILE_UUID" ]; then
            echo "ERROR: PROFILE_UUID is empty"
            exit 1
          fi

      # ---------------------------------------------------------
      # Configure Xcode signing
      # ---------------------------------------------------------
      - name: Configure Xcode signing
        working-directory: mobile
        env:
          TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM_ID }}
        run: |
          python3 <<'PY'
          import os
          from pathlib import Path

          path = Path("ios/Runner.xcodeproj/project.pbxproj")
          text = path.read_text()

          team_id = os.environ["TEAM_ID"]
          profile_name = os.environ["PROFILE_NAME"]

          # Runner target only.
          # We modify the signing settings used by the application target.
          text = text.replace(
              'CODE_SIGN_STYLE = Automatic;',
              'CODE_SIGN_STYLE = Manual;'
          )

          # Add signing settings to Runner configurations where they
          # are not already present.
          lines = text.splitlines()

          output = []

          for line in lines:
              output.append(line)

              stripped = line.strip()

              if stripped == 'CODE_SIGN_STYLE = Manual;':
                  indent = line[:len(line) - len(line.lstrip())]

                  output.append(
                      f'{indent}DEVELOPMENT_TEAM = {team_id};'
                  )
                  output.append(
                      f'{indent}CODE_SIGN_IDENTITY = "Apple Distribution";'
                  )
                  output.append(
                      f'{indent}PROVISIONING_PROFILE_SPECIFIER = "{profile_name}";'
                  )

          path.write_text("\n".join(output) + "\n")

          print("Xcode signing configuration updated.")
          PY

          grep -n \
            -E "CODE_SIGN_STYLE|DEVELOPMENT_TEAM|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER" \
            ios/Runner.xcodeproj/project.pbxproj

      # ---------------------------------------------------------
      # Create ExportOptions.plist
      # ---------------------------------------------------------
      - name: Create ExportOptions.plist
        working-directory: mobile
        env:
          TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM_ID }}
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>${TEAM_ID}</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>com.wordzoo.app.wordzoo</key>
                  <string>${PROFILE_NAME}</string>
              </dict>

              <key>signingCertificate</key>
              <string>Apple Distribution</string>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          cat ios/ExportOptions.plist

      - name: Verify signing configuration
        working-directory: mobile
        run: |
          echo "=== Signing identities ==="

          security find-identity \
            -v \
            -p codesigning \
            "$RUNNER_TEMP/wordzoo-build.keychain-db"

          echo ""
          echo "=== Provisioning profile ==="

          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles"

          security cms \
            -D \
            -i "$HOME/Library/MobileDevice/Provisioning Profiles/WordZoo.mobileprovision" \
            > "$RUNNER_TEMP/profile-check.plist"

          echo "Profile:"
          /usr/libexec/PlistBuddy \
            -c "Print :Name" \
            "$RUNNER_TEMP/profile-check.plist"

          echo "UUID:"
          /usr/libexec/PlistBuddy \
            -c "Print :UUID" \
            "$RUNNER_TEMP/profile-check.plist"

          echo "Application ID:"
          /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            "$RUNNER_TEMP/profile-check.plist"

          echo "Team ID:"
          /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:com.apple.developer.team-identifier" \
            "$RUNNER_TEMP/profile-check.plist"
      # ---------------------------------------------------------
      # Build IPA
      # ---------------------------------------------------------
      - name: Build iOS IPA
        working-directory: mobile
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM_ID }}
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: ${{ env.PROFILE_NAME }}
        run: |
          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist \
            --build-name=1.0.0 \
            --build-number=${GITHUB_RUN_NUMBER}

      # ---------------------------------------------------------
      # Upload IPA artifact
      # ---------------------------------------------------------
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordZoo-iOS
          path: mobile/build/ios/ipa/*.ipa

      # ---------------------------------------------------------
      # Upload to App Store Connect
      # ---------------------------------------------------------
      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID_1 }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"

          printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

          xcrun altool \
            --upload-app \
            --type ios \
            --file mobile/build/ios/ipa/*.ipa \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"