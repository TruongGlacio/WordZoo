name: Build iOS and Upload TestFlight

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v5

      # =========================================================
      # 2. Setup Flutter
      # =========================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        working-directory: mobile
        run: flutter --version

      - name: Flutter pub get
        working-directory: mobile
        run: flutter pub get

      # =========================================================
      # 3. Install Apple Distribution Certificate
      # =========================================================
      - name: Install signing certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -e

          CERTIFICATE_PATH="$RUNNER_TEMP/WordZoo_Distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/wordzoo-build.keychain-db"

          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          echo "Creating temporary keychain..."

          security create-keychain \
            -p "github-actions" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "github-actions" \
            "$KEYCHAIN_PATH"

          echo "Importing Apple Distribution certificate..."

          security import "$CERTIFICATE_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "github-actions" \
            "$KEYCHAIN_PATH"

          security list-keychain \
            -d user \
            -s "$KEYCHAIN_PATH" \
            "$HOME/Library/Keychains/login.keychain-db"

          security default-keychain \
            -s "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          echo ""
          echo "=== CODE SIGNING IDENTITIES ==="

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

      # =========================================================
      # 4. Install App Store Provisioning Profile
      # =========================================================
      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e

          PROFILE_PATH="$RUNNER_TEMP/WordZoo.mobileprovision"

          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          mkdir -p "$PROFILE_DIR"

          security cms \
            -D \
            -i "$PROFILE_PATH" \
            > "$RUNNER_TEMP/profile.plist"

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_APP_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_TEAM_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:com.apple.developer.team-identifier" \
              "$RUNNER_TEMP/profile.plist"
          )

          echo "Provisioning Profile:"
          echo "  Name: $PROFILE_NAME"
          echo "  UUID: $PROFILE_UUID"
          echo "  App ID: $PROFILE_APP_ID"
          echo "  Team ID: $PROFILE_TEAM_ID"

          cp "$PROFILE_PATH" \
            "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_APP_ID=$PROFILE_APP_ID" >> "$GITHUB_ENV"
          echo "PROFILE_TEAM_ID=$PROFILE_TEAM_ID" >> "$GITHUB_ENV"

      # =========================================================
      # 5. Verify Apple Signing
      # =========================================================
      - name: Verify Apple signing
        env:
          TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM_ID }}
        run: |
          set -e

          echo "========================================"
          echo "Apple Signing Verification"
          echo "========================================"

          echo ""
          echo "Expected Team ID:"
          echo "$TEAM_ID"

          echo ""
          echo "Provisioning Profile:"
          echo "$PROFILE_NAME"

          echo ""
          echo "Profile UUID:"
          echo "$PROFILE_UUID"

          echo ""
          echo "Profile App ID:"
          echo "$PROFILE_APP_ID"

          echo ""
          echo "Profile Team ID:"
          echo "$PROFILE_TEAM_ID"

          echo ""
          echo "Code Signing Identity:"
          security find-identity \
            -v \
            -p codesigning \
            "$RUNNER_TEMP/wordzoo-build.keychain-db"

          if [ "$PROFILE_TEAM_ID" != "$TEAM_ID" ]; then
            echo ""
            echo "ERROR: Provisioning Profile Team ID does not match Apple Team ID."
            exit 1
          fi

          if [ "$PROFILE_APP_ID" != "$TEAM_ID.com.wordzoo.app.wordzoo" ]; then
            echo ""
            echo "ERROR: Provisioning Profile App ID does not match Bundle ID."
            exit 1
          fi

          echo ""
          echo "Apple signing configuration looks correct."

      # =========================================================
      # 6. Configure Runner Release Signing
      # =========================================================
      - name: Configure Runner Release signing
        working-directory: mobile
        env:
          TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM_ID }}
        run: |
          set -e

          cat > ios/Flutter/Release.xcconfig <<EOF
          #include "Generated.xcconfig"

          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = ${TEAM_ID}
          CODE_SIGN_IDENTITY = Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER = ${PROFILE_NAME}
          EOF

          echo "========================================"
          echo "ios/Flutter/Release.xcconfig"
          echo "========================================"

          cat ios/Flutter/Release.xcconfig

      # =========================================================
      # 7. Verify Flutter iOS project
      # =========================================================
      - name: Verify iOS project
        working-directory: mobile
        run: |
          set -e

          echo "========================================"
          echo "Bundle IDs"
          echo "========================================"

          grep -n "PRODUCT_BUNDLE_IDENTIFIER" \
            ios/Runner.xcodeproj/project.pbxproj

          echo ""
          echo "========================================"
          echo "Release.xcconfig"
          echo "========================================"

          cat ios/Flutter/Release.xcconfig

          echo ""
          echo "========================================"
          echo "Release.xcconfig references"
          echo "========================================"

          grep -n -B 5 -A 5 \
            "Release.xcconfig" \
            ios/Runner.xcodeproj/project.pbxproj || true

      # =========================================================
      # 8. Create ExportOptions.plist
      # =========================================================
      - name: Create ExportOptions.plist
        working-directory: mobile
        env:
          TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM_ID }}
        run: |
          set -e

          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">
          <dict>

              <key>method</key>
              <string>app-store</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>${TEAM_ID}</string>

              <key>signingCertificate</key>
              <string>Apple Distribution</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>com.wordzoo.app.wordzoo</key>
                  <string>${PROFILE_NAME}</string>
              </dict>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>uploadSymbols</key>
              <true/>

          </dict>
          </plist>
          EOF

          echo "========================================"
          echo "ExportOptions.plist"
          echo "========================================"

          cat ios/ExportOptions.plist

      # =========================================================
      # 9. Archive
      # =========================================================
      - name: Archive iOS app
        working-directory: mobile
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/WordZoo.xcarchive"

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/WordZoo.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

      # =========================================================
      # 10. Export IPA
      # =========================================================
      - name: Export IPA
        working-directory: mobile
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/export"
          mkdir -p "$RUNNER_TEMP/export"

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/WordZoo.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export"

          echo ""
          echo "========================================"
          echo "Exported files"
          echo "========================================"

          ls -lah "$RUNNER_TEMP/export"

      # =========================================================
      # 11. Upload IPA as GitHub Artifact
      # =========================================================
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordZoo-iOS
          path: ${{ runner.temp }}/export/*.ipa

      # =========================================================
      # 12. Upload to TestFlight
      # =========================================================
      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID_1 }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -e

          PRIVATE_KEY_DIR="$RUNNER_TEMP/private_keys"

          mkdir -p "$PRIVATE_KEY_DIR"

          printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" \
            > "$PRIVATE_KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

          echo "Uploading IPA to App Store Connect..."

          xcrun altool \
            --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/"*.ipa \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

          echo ""
          echo "========================================"
          echo "Upload completed"
          echo "========================================"