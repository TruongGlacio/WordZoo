name: WordZoo iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Generate iOS project files
        run: flutter create --platforms=ios .

      - name: Get dependencies
        run: flutter pub get

      - name: Check iOS configuration
        run: |
          ls -la ios/Flutter
          test -f ios/Flutter/Release.xcconfig

      - name: Build iOS
        run: flutter build ios --release --no-codesign