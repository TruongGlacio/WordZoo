name: Build iOS and Upload TestFlight

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    env:
      TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM_ID }}
      BUNDLE_ID: com.wordzoo.app.wordzoo

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v5

      # =========================================================
      # 2. Setup Flutter
      # =========================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        working-directory: mobile
        run: flutter --version

      - name: Flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: Flutter iOS precache
        working-directory: mobile
        run: flutter precache --ios
      # =========================================================
      # Create .env
      # =========================================================
      - name: Create .env
        working-directory: mobile
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -e
          printf '%s\n' "$ENV_FILE" > .env
          test -s .env
          echo "Created mobile/.env"
      # =========================================================
      # 3. Install Apple Distribution Certificate
      # =========================================================
      - name: Install Apple Distribution certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -e

          CERTIFICATE_PATH="$RUNNER_TEMP/WordZoo_Distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/wordzoo-build.keychain-db"

          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain \
            -p "github-actions" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "github-actions" \
            "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "github-actions" \
            "$KEYCHAIN_PATH"

          security list-keychain \
            -d user \
            -s "$KEYCHAIN_PATH" \
               "$HOME/Library/Keychains/login.keychain-db"

          security default-keychain \
            -s "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          echo "=== CODE SIGNING IDENTITIES ==="

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

      # =========================================================
      # 4. Install Provisioning Profile
      # =========================================================
      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e

          PROFILE_PATH="$RUNNER_TEMP/WordZoo.mobileprovision"

          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          mkdir -p \
            "$HOME/Library/MobileDevice/Provisioning Profiles"

          security cms \
            -D \
            -i "$PROFILE_PATH" \
            > "$RUNNER_TEMP/profile.plist"

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_TEAM_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:com.apple.developer.team-identifier" \
              "$RUNNER_TEMP/profile.plist"
          )

          PROFILE_APP_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              "$RUNNER_TEMP/profile.plist"
          )

          echo "=== PROVISIONING PROFILE ==="
          echo "Name: $PROFILE_NAME"
          echo "UUID: $PROFILE_UUID"
          echo "Team ID: $PROFILE_TEAM_ID"
          echo "Application ID: $PROFILE_APP_ID"

          if [ "$PROFILE_TEAM_ID" != "$TEAM_ID" ]; then
            echo "ERROR: Provisioning Profile Team ID does not match APPLE_DEVELOPMENT_TEAM_ID"
            exit 1
          fi

          if [ "$PROFILE_APP_ID" != "$TEAM_ID.$BUNDLE_ID" ]; then
            echo "ERROR: Provisioning Profile App ID does not match Bundle ID"
            echo "Expected: $TEAM_ID.$BUNDLE_ID"
            echo "Actual:   $PROFILE_APP_ID"
            exit 1
          fi

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      # =========================================================
      # 5. Create CI xcconfig
      # =========================================================
      - name: Create CI signing xcconfig
        working-directory: mobile
        run: |
          set -e

          DART_DEFINES=$(python3 -c \
            "import base64; print(base64.b64encode(b'USE_TEST_ADS=false').decode())")

          cat > ios/Flutter/CIRelease.xcconfig <<EOF
          #include "Generated.xcconfig"

          DART_DEFINES=$DART_DEFINES
          EOF

          echo "=== CIRelease.xcconfig ==="
          cat ios/Flutter/CIRelease.xcconfig

      # =========================================================
      # 6. Verify project signing configuration
      # =========================================================
      # =========================================================
      # 6. Verify Runner signing configuration
      # =========================================================
      - name: Verify Runner signing configuration
        working-directory: mobile
        run: |
          set -e

          echo "=== RUNNER RELEASE SIGNING ==="

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -showBuildSettings \
            | grep -E \
              "PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_STYLE|DEVELOPMENT_TEAM|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER"

      # =========================================================
      # 7. Verify certificate + profile
      # =========================================================
      - name: Verify Apple signing
        run: |
          set -e

          echo "=== KEYCHAIN ==="

          security default-keychain

          echo ""
          echo "=== IDENTITIES ==="

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

          echo ""
          echo "=== PROVISIONING PROFILES ==="

          ls -la \
            "$HOME/Library/MobileDevice/Provisioning Profiles"
            
    # =========================================================
    # 8. Clean Flutter/Xcode build
    # =========================================================
      - name: Clean build
        working-directory: mobile
        run: |
          set -e

          flutter clean

          rm -rf ios/Pods
          rm -rf ios/.symlinks
          rm -rf ios/Flutter/ephemeral
          rm -rf ~/Library/Developer/Xcode/DerivedData/*

          flutter pub get
          flutter precache --ios

          echo "=== Check Podfile ==="
          test -f ios/Podfile
          ls -la ios/Podfile

          echo "=== CocoaPods ==="
          cd ios
          pod update
          pod install --repo-update

      # =========================================================
      # Verify final Runner signing
      # =========================================================
      - name: Verify final Runner signing
        working-directory: mobile
        run: |
          set -e

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -showBuildSettings \
          | grep -E \
            "CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER|PRODUCT_BUNDLE_IDENTIFIER"
      # =========================================================
      # 9. Archive
      # =========================================================
      - name: Archive iOS app
        working-directory: mobile
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/WordZoo.xcarchive"
          cd ios
          pod update
          pod install --repo-update
          echo "=== ARCHIVE SIGNING CONFIG ==="
          echo "TEAM_ID=$TEAM_ID"
          echo "PROFILE_NAME=$PROFILE_NAME"
          echo "PROFILE_UUID=$PROFILE_UUID"


          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/WordZoo.xcarchive" \
            -xcconfig Flutter/CIRelease.xcconfig \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            archive

      # =========================================================
      # 10. Create ExportOptions.plist
      # =========================================================
      - name: Create ExportOptions.plist
        working-directory: mobile
        run: |
          set -e

          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>${TEAM_ID}</string>

              <key>signingCertificate</key>
              <string>Apple Distribution</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${PROFILE_NAME}</string>
              </dict>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          echo "=== ExportOptions.plist ==="
          cat ios/ExportOptions.plist

      # =========================================================
      # 11. Export IPA
      # =========================================================
      - name: Export IPA
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/export"

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/WordZoo.xcarchive" \
            -exportOptionsPlist mobile/ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export"

          echo "=== EXPORTED FILES ==="

          ls -lah "$RUNNER_TEMP/export"

      # =========================================================
      # 12. Upload IPA Artifact
      # =========================================================
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordZoo-iOS
          path: ${{ runner.temp }}/export/*.ipa

      # =========================================================
      # 13. Upload to TestFlight
      # =========================================================
      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID_1 }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          KEY_ID="$(printf '%s' "$APP_STORE_CONNECT_KEY_ID" | tr -d '[:space:]')"

          if [ -z "$KEY_ID" ]; then
            echo "ERROR: APP_STORE_CONNECT_KEY_ID is empty"
            exit 1
          fi

          if [ -z "$APP_STORE_CONNECT_ISSUER_ID" ]; then
            echo "ERROR: APP_STORE_CONNECT_ISSUER_ID is empty"
            exit 1
          fi

          if [ -z "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            echo "ERROR: APP_STORE_CONNECT_PRIVATE_KEY is empty"
            exit 1
          fi

          # altool searches here automatically
          KEY_DIR="$HOME/private_keys"
          mkdir -p "$KEY_DIR"

          KEY_PATH="$KEY_DIR/AuthKey_${KEY_ID}.p8"

          echo "Creating App Store Connect API key..."

          printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" \
            | tr -d '\r' \
            > "$KEY_PATH"

          chmod 600 "$KEY_PATH"

          echo "Checking generated key file..."

          if [ ! -f "$KEY_PATH" ]; then
            echo "ERROR: API key file was not created"
            exit 1
          fi

          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_PATH"; then
            echo "ERROR: Invalid private key format"
            exit 1
          fi

          if ! grep -q "END PRIVATE KEY" "$KEY_PATH"; then
            echo "ERROR: Invalid private key format"
            exit 1
          fi

          echo "API key file exists."
          echo "Private key format OK."

          IPA_FILE="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)"

          if [ -z "$IPA_FILE" ]; then
            echo "ERROR: IPA not found"
            exit 1
          fi

          echo "IPA found."

          echo "KEY_ID length: ${#KEY_ID}"
          echo "KEY_PATH: $KEY_PATH"
          ls -la "$KEY_DIR"

          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_FILE" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"