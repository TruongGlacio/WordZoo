name: Build iOS and Upload TestFlight

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v5

      # ---------------------------------------------------------
      # Flutter
      # ---------------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        working-directory: mobile
        run: flutter --version

      - name: Flutter pub get
        working-directory: mobile
        run: flutter pub get

      # ---------------------------------------------------------
      # Install Apple Distribution certificate
      # ---------------------------------------------------------
      - name: Install signing certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -e

          CERTIFICATE_PATH="$RUNNER_TEMP/WordZoo_Distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/wordzoo-build.keychain-db"

          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          echo "Creating keychain..."

          security create-keychain \
            -p "github-actions" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "github-actions" \
            "$KEYCHAIN_PATH"

          echo "Importing certificate..."

          security import "$CERTIFICATE_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          echo "Configuring keychain..."

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "github-actions" \
            "$KEYCHAIN_PATH"

          # IMPORTANT:
          # Make the custom keychain visible to Flutter/Xcode
          security list-keychain \
            -d user \
            -s "$KEYCHAIN_PATH" \
               "$HOME/Library/Keychains/login.keychain-db"

          # Make it the default keychain
          security default-keychain \
            -s "$KEYCHAIN_PATH"

          echo "======================================"
          echo "Default keychain"
          echo "======================================"

          security default-keychain

          echo "======================================"
          echo "Keychain search list"
          echo "======================================"

          security list-keychain

          echo "======================================"
          echo "Code signing identities"
          echo "======================================"

          security find-identity \
            -v \
            -p codesigning

          echo "======================================"
          echo "Direct keychain check"
          echo "======================================"

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # Verify signing identity
      # ---------------------------------------------------------
      - name: Get signing identity
        run: |
          security find-identity \
            -v \
            -p codesigning \
            "$RUNNER_TEMP/wordzoo-build.keychain-db"

      # ---------------------------------------------------------
      # Install provisioning profile
      # ---------------------------------------------------------
      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH="$RUNNER_TEMP/WordZoo.mobileprovision"

          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/WordZoo.mobileprovision"

          security cms \
            -D \
            -i "$PROFILE_PATH" \
            > "$RUNNER_TEMP/profile.plist"

          PROFILE_NAME=$(/usr/libexec/PlistBuddy \
            -c "Print :Name" \
            "$RUNNER_TEMP/profile.plist")

          PROFILE_UUID=$(/usr/libexec/PlistBuddy \
            -c "Print :UUID" \
            "$RUNNER_TEMP/profile.plist")

          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            "$RUNNER_TEMP/profile.plist")

          PROFILE_TEAM_ID=$(/usr/libexec/PlistBuddy \
            -c "Print :Entitlements:com.apple.developer.team-identifier" \
            "$RUNNER_TEMP/profile.plist")

          echo "======================================"
          echo "Provisioning Profile"
          echo "Name: $PROFILE_NAME"
          echo "UUID: $PROFILE_UUID"
          echo "Application ID: $PROFILE_APP_ID"
          echo "Team ID: $PROFILE_TEAM_ID"
          echo "======================================"

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # Verify Bundle ID and Team ID
      # ---------------------------------------------------------
      - name: Verify signing configuration
        env:
          TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM_ID }}
        run: |
          echo "Expected Team ID: $TEAM_ID"
          echo "Profile Name: $PROFILE_NAME"
          echo "Profile UUID: $PROFILE_UUID"

          if [ -z "$PROFILE_NAME" ]; then
            echo "ERROR: PROFILE_NAME is empty"
            exit 1
          fi

          if [ -z "$PROFILE_UUID" ]; then
            echo "ERROR: PROFILE_UUID is empty"
            exit 1
          fi

      # ---------------------------------------------------------
      # Configure Xcode signing
      # ---------------------------------------------------------
      - name: Configure Xcode signing
        working-directory: mobile
        env:
          TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM_ID }}
        run: |
          python3 <<'PY'
          import os
          from pathlib import Path

          path = Path("ios/Runner.xcodeproj/project.pbxproj")
          text = path.read_text()

          team_id = os.environ["TEAM_ID"]
          profile_name = os.environ["PROFILE_NAME"]

          # Runner target only.
          # We modify the signing settings used by the application target.
          text = text.replace(
              'CODE_SIGN_STYLE = Automatic;',
              'CODE_SIGN_STYLE = Manual;'
          )

          # Add signing settings to Runner configurations where they
          # are not already present.
          lines = text.splitlines()

          output = []

          for line in lines:
              output.append(line)

              stripped = line.strip()

              if stripped == 'CODE_SIGN_STYLE = Manual;':
                  indent = line[:len(line) - len(line.lstrip())]

                  output.append(
                      f'{indent}DEVELOPMENT_TEAM = {team_id};'
                  )
                  output.append(
                      f'{indent}CODE_SIGN_IDENTITY = "Apple Distribution";'
                  )
                  output.append(
                      f'{indent}PROVISIONING_PROFILE_SPECIFIER = "{profile_name}";'
                  )

          path.write_text("\n".join(output) + "\n")

          print("Xcode signing configuration updated.")
          PY

          grep -n \
            -E "CODE_SIGN_STYLE|DEVELOPMENT_TEAM|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER" \
            ios/Runner.xcodeproj/project.pbxproj

      # ---------------------------------------------------------
      # Create ExportOptions.plist
      # ---------------------------------------------------------
      - name: Create ExportOptions.plist
        working-directory: mobile
        env:
          TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM_ID }}
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>${TEAM_ID}</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>com.wordzoo.app.wordzoo</key>
                  <string>${PROFILE_NAME}</string>
              </dict>

              <key>signingCertificate</key>
              <string>Apple Distribution</string>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          cat ios/ExportOptions.plist

      - name: Verify signing configuration
        working-directory: mobile
        run: |
          echo "=== Signing identities ==="

          security find-identity \
            -v \
            -p codesigning \
            "$RUNNER_TEMP/wordzoo-build.keychain-db"

          echo ""
          echo "=== Provisioning profile ==="

          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles"

          security cms \
            -D \
            -i "$HOME/Library/MobileDevice/Provisioning Profiles/WordZoo.mobileprovision" \
            > "$RUNNER_TEMP/profile-check.plist"

          echo "Profile:"
          /usr/libexec/PlistBuddy \
            -c "Print :Name" \
            "$RUNNER_TEMP/profile-check.plist"

          echo "UUID:"
          /usr/libexec/PlistBuddy \
            -c "Print :UUID" \
            "$RUNNER_TEMP/profile-check.plist"

          echo "Application ID:"
          /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            "$RUNNER_TEMP/profile-check.plist"

          echo "Team ID:"
          /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:com.apple.developer.team-identifier" \
            "$RUNNER_TEMP/profile-check.plist"
      # ---------------------------------------------------------
      # Verify Flutter signing environment
      # ---------------------------------------------------------
      - name: Verify Flutter signing environment
        run: |
          echo "=== DEFAULT KEYCHAIN ==="
          security default-keychain

          echo ""
          echo "=== KEYCHAIN SEARCH LIST ==="
          security list-keychain

          echo ""
          echo "=== CODE SIGNING IDENTITIES ==="
          security find-identity -v -p codesigning
      # ---------------------------------------------------------
      # Configure Flutter/Xcode signing
      # ---------------------------------------------------------
      - name: Configure Flutter/Xcode signing
        working-directory: mobile
        env:
          TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM_ID }}
        run: |
          set -e

          echo "Team ID: $TEAM_ID"
          echo "Profile: $PROFILE_NAME"

          # Force Flutter project to use manual distribution signing
          python3 <<'PY'
          import os
          from pathlib import Path

          path = Path("ios/Runner.xcodeproj/project.pbxproj")
          text = path.read_text()

          team = os.environ["TEAM_ID"]
          profile = os.environ["PROFILE_NAME"]

          # Only modify Runner application target configurations.
          # Flutter generated projects normally have these settings.
          text = text.replace(
              'CODE_SIGN_STYLE = Automatic;',
              'CODE_SIGN_STYLE = Manual;'
          )

          # Add DEVELOPMENT_TEAM if missing in a build configuration.
          lines = text.splitlines()
          output = []

          for line in lines:
              output.append(line)

              if line.strip() == 'CODE_SIGN_STYLE = Manual;':
                  indent = line[:len(line) - len(line.lstrip())]

                  output.append(
                      f'{indent}DEVELOPMENT_TEAM = {team};'
                  )
                  output.append(
                      f'{indent}CODE_SIGN_IDENTITY = "Apple Distribution";'
                  )
                  output.append(
                      f'{indent}PROVISIONING_PROFILE_SPECIFIER = "{profile}";'
                  )

          path.write_text("\n".join(output) + "\n")
          PY

          echo "=== Signing settings ==="

          grep -n \
            -E "CODE_SIGN_STYLE|DEVELOPMENT_TEAM|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE_SPECIFIER" \
            ios/Runner.xcodeproj/project.pbxproj

      # ---------------------------------------------------------
      # Inspect Xcode project signing
      # ---------------------------------------------------------
      - name: Inspect Xcode project signing
        working-directory: mobile
        run: |
          echo "=== Bundle identifiers ==="
          grep -n "PRODUCT_BUNDLE_IDENTIFIER" ios/Runner.xcodeproj/project.pbxproj

          echo ""
          echo "=== Development Team ==="
          grep -n "DEVELOPMENT_TEAM" ios/Runner.xcodeproj/project.pbxproj || true

          echo ""
          echo "=== Code Sign Identity ==="
          grep -n "CODE_SIGN_IDENTITY" ios/Runner.xcodeproj/project.pbxproj || true

          echo ""
          echo "=== Code Sign Style ==="
          grep -n "CODE_SIGN_STYLE" ios/Runner.xcodeproj/project.pbxproj || true

          echo ""
          echo "=== Provisioning Profile ==="
          grep -n "PROVISIONING_PROFILE" ios/Runner.xcodeproj/project.pbxproj || true
      # ---------------------------------------------------------
      # Configure Flutter signing
      # ---------------------------------------------------------
      - name: Configure Flutter signing
        working-directory: mobile
        env:
          TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM_ID }}
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import os

          path = Path("ios/Runner.xcodeproj/project.pbxproj")
          text = path.read_text()

          team = os.environ["TEAM_ID"]

          text = text.replace(
              "CODE_SIGN_STYLE = Automatic;",
              "CODE_SIGN_STYLE = Manual;"
          )

          text = text.replace(
              "DEVELOPMENT_TEAM = ;",
              f"DEVELOPMENT_TEAM = {team};"
          )

          path.write_text(text)
          PY

          echo "=== DEVELOPMENT_TEAM ==="
          grep -n "DEVELOPMENT_TEAM" ios/Runner.xcodeproj/project.pbxproj || true
      # ---------------------------------------------------------
      # Check Xcode signing config
      # ---------------------------------------------------------
      - name: Check Xcode signing config
        working-directory: mobile
        run: |
          echo "=== DEVELOPMENT TEAM ==="
          grep -n "DEVELOPMENT_TEAM" ios/Runner.xcodeproj/project.pbxproj || true

          echo ""
          echo "=== CODE SIGN STYLE ==="
          grep -n "CODE_SIGN_STYLE" ios/Runner.xcodeproj/project.pbxproj || true

          echo ""
          echo "=== BUNDLE ID ==="
          grep -n "PRODUCT_BUNDLE_IDENTIFIER" ios/Runner.xcodeproj/project.pbxproj
      # ---------------------------------------------------------
      # Build IPA
      # ---------------------------------------------------------
      - name: Build Flutter iOS
        working-directory: mobile
        run: |
          flutter build ios \
            --release \
            --no-codesign
      # ---------------------------------------------------------
      # Archive iOS app
      # ---------------------------------------------------------    
      - name: Archive iOS app
        working-directory: mobile
        env:
          TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM_ID }}
        run: |
          set -e
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/WordZoo.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive
      # ---------------------------------------------------------
      # Export IPA
      # ---------------------------------------------------------
      - name: Export IPA
        run: |
          set -e

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/WordZoo.xcarchive" \
            -exportOptionsPlist mobile/ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export"

          ls -lah "$RUNNER_TEMP/export"

      # ---------------------------------------------------------
      # Upload IPA artifact
      # ---------------------------------------------------------
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordZoo-iOS
          path: ${{ runner.temp }}/export/*.ipa

      # ---------------------------------------------------------
      # Upload to App Store Connect
      # ---------------------------------------------------------
      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID_1 }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"

          printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" \
            > "$RUNNER_TEMP/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

          xcrun altool \
            --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export"/*.ipa \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"