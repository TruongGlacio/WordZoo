name: Sync WordZoo to B

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout A
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify B token
        env:
          TOKEN: ${{ secrets.B_REPO_TOKEN }}
        run: |
          test -n "$TOKEN"
          echo "B_REPO_TOKEN exists"

      - name: Verify B account
        env:
          TOKEN: ${{ secrets.B_REPO_TOKEN }}
        run: |
          curl -fsS \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user \
            | grep '"login": "buixuantruongtb2-ops"'

      - name: Verify B repository
        env:
          TOKEN: ${{ secrets.B_REPO_TOKEN }}
        run: |
          curl -fsS \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/buixuantruongtb2-ops/WordZoo \
            | grep '"push": true'

      - name: Push A to B
        env:
          TOKEN: ${{ secrets.B_REPO_TOKEN }}
        run: |
          git remote add backup \
            https://github.com/buixuantruongtb2-ops/WordZoo.git

          git -c http.extraheader="AUTHORIZATION: bearer ${TOKEN}" \
            push backup HEAD:main --force