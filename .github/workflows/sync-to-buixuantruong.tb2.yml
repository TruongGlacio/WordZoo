- name: Check B_REPO_TOKEN
  env:
    TOKEN: ${{ secrets.B_REPO_TOKEN }}
  run: |
    if [ -z "$TOKEN" ]; then
      echo "❌ B_REPO_TOKEN is EMPTY"
      exit 1
    fi

    echo "✅ B_REPO_TOKEN exists"
    echo "Token length: ${#TOKEN}"

- name: Test authentication to B
  env:
    TOKEN: ${{ secrets.B_REPO_TOKEN }}
  run: |
    curl -sS \
      -H "Authorization: Bearer ${TOKEN}" \
      -H "Accept: application/vnd.github+json" \
      https://api.github.com/user