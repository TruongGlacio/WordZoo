name: Sync WordZoo to B

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout A
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to B
        env:
          TOKEN: ${{ secrets.B_REPO_TOKEN }}
        run: |
          git remote add backup https://x-access-token:${TOKEN}@github.com/buixuantruongtb2-ops/WordZoo.git
          git push backup main:main --force