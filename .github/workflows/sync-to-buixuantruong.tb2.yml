name: Sync WordZoo to B

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout A
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify B token
        env:
          TOKEN: ${{ secrets.B_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "B_REPO_TOKEN is empty"
            exit 1
          fi

          echo "B_REPO_TOKEN exists"
          echo "Token length: ${#TOKEN}"

      - name: Verify B account
        env:
          TOKEN: ${{ secrets.B_REPO_TOKEN }}
        run: |
          curl -fsS \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user \
            | grep '"login": "buixuantruongtb2-ops"'

      - name: Push A to B
        env:
          TOKEN: ${{ secrets.B_REPO_TOKEN }}
        run: |
          git remote add backup "https://x-access-token:${TOKEN}@github.com/buixuantruongtb2-ops/WordZoo.git"
          git push backup HEAD:main --force