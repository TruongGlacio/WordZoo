name: wordzoo
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  equatable: ^2.1.0

  # Supabase
  supabase_flutter: ^2.16.0

  # UI / Responsive
  responsive_framework: ^1.5.1
  flutter_animate: ^4.5.2

  # Media
  audioplayers: ^6.8.1
  cached_network_image: ^3.4.1

  # Storage
  shared_preferences: ^2.5.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Background sync
  workmanager: ^0.9.0+3

  # Payments
  in_app_purchase: ^3.3.0

  # Code generation
  json_annotation: ^4.12.0

  # Logging
  logger: ^2.7.0

  # Utils
  flutter_dotenv: ^6.0.1

  # Localization
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

  # Google Fonts
  google_fonts: ^8.2.0

  cupertino_icons: ^1.0.9

dependency_overrides:
  meta: ^1.19.0
  jni: 1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.2
  json_serializable: ^6.14.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - .env
